[project]
name = "recipes"
version = "0.1.0"
description = "Recipe data model and API"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "email-validator>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recipes*"]

[tool.ruff]
line-length = 95
target-version = "py312"
